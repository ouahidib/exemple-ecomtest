spring.application.name=client-ms
# activer l'utilisation de config-service
spring.cloud.config.enabled=true

# CONFIG_URL du service config servira pour docker-compose.
# l'URL du config-ms va être htt://localhost:9999 si CONFIG_URL n'est pas
#définie et CONFIG_URL le cas contraire
spring.config.import=optional:configserver:${CONFIG_URL:http://localhost:9999}





